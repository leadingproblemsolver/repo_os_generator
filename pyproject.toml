[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-os-generator"
version = "1.0.0"
description = "Deterministic repository-operating-system generator and validator with an executable support-agent reference domain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8"]

[project.scripts]
repo-os = "repo_os_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
